name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate secrets and configure Cloudflare
        id: configure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          NEXT_PUBLIC_STORAGE_TYPE: ${{ secrets.NEXT_PUBLIC_STORAGE_TYPE }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SEARCH_MAX_PAGE: ${{ secrets.NEXT_PUBLIC_SEARCH_MAX_PAGE }}
          NEXT_PUBLIC_DOUBAN_PROXY_TYPE: ${{ secrets.NEXT_PUBLIC_DOUBAN_PROXY_TYPE }}
          NEXT_PUBLIC_DOUBAN_PROXY: ${{ secrets.NEXT_PUBLIC_DOUBAN_PROXY }}
          NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE: ${{ secrets.NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE }}
          NEXT_PUBLIC_DOUBAN_IMAGE_PROXY: ${{ secrets.NEXT_PUBLIC_DOUBAN_IMAGE_PROXY }}
          NEXT_PUBLIC_DISABLE_YELLOW_FILTER: ${{ secrets.NEXT_PUBLIC_DISABLE_YELLOW_FILTER }}
          NEXT_PUBLIC_FLUID_SEARCH: ${{ secrets.NEXT_PUBLIC_FLUID_SEARCH }}
          NEXT_PUBLIC_PROXY_M3U8_TOKEN: ${{ secrets.NEXT_PUBLIC_PROXY_M3U8_TOKEN }}
          NEXT_PUBLIC_DANMAKU_CACHE_EXPIRE_MINUTES: ${{ secrets.NEXT_PUBLIC_DANMAKU_CACHE_EXPIRE_MINUTES }}
          NEXT_PUBLIC_VOICE_CHAT_STRATEGY: ${{ secrets.NEXT_PUBLIC_VOICE_CHAT_STRATEGY }}
          NEXT_PUBLIC_ENABLE_OFFLINE_DOWNLOAD: ${{ secrets.NEXT_PUBLIC_ENABLE_OFFLINE_DOWNLOAD }}
          NEXT_PUBLIC_ENABLE_SOURCE_SEARCH: ${{ secrets.NEXT_PUBLIC_ENABLE_SOURCE_SEARCH }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_PROXY: ${{ secrets.TMDB_PROXY }}
          TMDB_REVERSE_PROXY: ${{ secrets.TMDB_REVERSE_PROXY }}
          DANMAKU_API_BASE: ${{ secrets.DANMAKU_API_BASE }}
          DANMAKU_API_TOKEN: ${{ secrets.DANMAKU_API_TOKEN }}
          ANNOUNCEMENT: ${{ secrets.ANNOUNCEMENT }}
          CRON_PASSWORD: ${{ secrets.CRON_PASSWORD }}
          SITE_BASE: ${{ secrets.SITE_BASE }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KVROCKS_URL: ${{ secrets.KVROCKS_URL }}
          INIT_CONFIG: ${{ secrets.INIT_CONFIG }}
          CONFIG_SUBSCRIPTION_URL: ${{ secrets.CONFIG_SUBSCRIPTION_URL }}
          ENABLE_TVBOX_SUBSCRIBE: ${{ secrets.ENABLE_TVBOX_SUBSCRIBE }}
          TVBOX_SUBSCRIBE_TOKEN: ${{ secrets.TVBOX_SUBSCRIBE_TOKEN }}
          WATCH_ROOM_ENABLED: ${{ secrets.WATCH_ROOM_ENABLED }}
          WATCH_ROOM_EXTERNAL_SERVER_AUTH: ${{ secrets.WATCH_ROOM_EXTERNAL_SERVER_AUTH }}
          WATCH_ROOM_EXTERNAL_SERVER_URL: ${{ secrets.WATCH_ROOM_EXTERNAL_SERVER_URL }}
          WATCH_ROOM_SERVER_TYPE: ${{ secrets.WATCH_ROOM_SERVER_TYPE }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync, appendFileSync } = require('node:fs');
          const { randomUUID } = require('node:crypto');
          const publicNames = [
            'NEXT_PUBLIC_STORAGE_TYPE', 'NEXT_PUBLIC_SITE_NAME',
            'NEXT_PUBLIC_SEARCH_MAX_PAGE', 'NEXT_PUBLIC_DOUBAN_PROXY_TYPE',
            'NEXT_PUBLIC_DOUBAN_PROXY', 'NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE',
            'NEXT_PUBLIC_DOUBAN_IMAGE_PROXY', 'NEXT_PUBLIC_DISABLE_YELLOW_FILTER',
            'NEXT_PUBLIC_FLUID_SEARCH', 'NEXT_PUBLIC_PROXY_M3U8_TOKEN',
            'NEXT_PUBLIC_DANMAKU_CACHE_EXPIRE_MINUTES', 'NEXT_PUBLIC_VOICE_CHAT_STRATEGY',
            'NEXT_PUBLIC_ENABLE_OFFLINE_DOWNLOAD', 'NEXT_PUBLIC_ENABLE_SOURCE_SEARCH',
          ];
          const privateNames = [
            'USERNAME', 'PASSWORD', 'UPSTASH_URL', 'UPSTASH_TOKEN', 'TMDB_API_KEY',
            'TMDB_PROXY', 'TMDB_REVERSE_PROXY', 'DANMAKU_API_BASE', 'DANMAKU_API_TOKEN',
            'ANNOUNCEMENT', 'CRON_PASSWORD', 'SITE_BASE', 'REDIS_URL', 'KVROCKS_URL',
            'INIT_CONFIG', 'CONFIG_SUBSCRIPTION_URL', 'ENABLE_TVBOX_SUBSCRIBE',
            'TVBOX_SUBSCRIBE_TOKEN', 'WATCH_ROOM_ENABLED',
            'WATCH_ROOM_EXTERNAL_SERVER_AUTH', 'WATCH_ROOM_EXTERNAL_SERVER_URL',
            'WATCH_ROOM_SERVER_TYPE',
          ];
          const storage = process.env.NEXT_PUBLIC_STORAGE_TYPE;
          const required = [
            'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID',
            'USERNAME', 'PASSWORD', 'NEXT_PUBLIC_STORAGE_TYPE',
            ...(storage === 'upstash' ? ['UPSTASH_URL', 'UPSTASH_TOKEN'] : []),
            ...(storage === 'd1' ? ['D1_DATABASE_ID'] : []),
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            console.error(`::error::Missing required GitHub Secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          if (storage === 'upstash') {
            let valid = false;
            try { valid = new URL(process.env.UPSTASH_URL).protocol === 'https:'; } catch {}
            if (!valid) {
              console.error('::error::UPSTASH_URL must be the HTTPS REST URL.');
              process.exit(1);
            }
          }
          let config = readFileSync('wrangler.toml', 'utf8');
          if (storage === 'd1') {
            if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(process.env.D1_DATABASE_ID)) {
              console.error('::error::D1_DATABASE_ID must be a database UUID.');
              process.exit(1);
            }
            config = config.replaceAll('REPLACE_WITH_YOUR_D1_DATABASE_ID', process.env.D1_DATABASE_ID);
          } else {
            config = config.replace(/^\[\[d1_databases\]\][\s\S]*?(?=^\[|(?![\s\S]))/gm, '');
          }
          // Only public settings go into [vars]; private values use Worker Secrets.
          for (const name of publicNames) {
            if (process.env[name]) config += `\n${name} = ${JSON.stringify(process.env[name])}\n`;
          }
          writeFileSync('wrangler.toml', config);
          const runtimeNames = [...publicNames, ...privateNames].filter((name) => process.env[name]);
          const values = runtimeNames.map((name) => [name, process.env[name]]);
          values.push(['BUILD_TARGET', 'cloudflare'], ['NODE_ENV', 'production']);
          for (const [name, value] of values) {
            const delimiter = `ENV_${randomUUID()}`;
            appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value}\n${delimiter}\n`);
          }
          const secretNames = privateNames.filter((name) => process.env[name]);
          appendFileSync(process.env.GITHUB_OUTPUT, `secret_names<<SECRETS\n${secretNames.join('\n')}\nSECRETS\n`);
          console.log('Cloudflare configuration validated; private values will be uploaded as Worker Secrets.');
          NODE

      - name: Build for Cloudflare
        run: pnpm run build:cloudflare

      - name: Install Wrangler for D1 migrations
        if: env.NEXT_PUBLIC_STORAGE_TYPE == 'd1'
        run: pnpm add -g wrangler@4.60.0

      - name: Run D1 Database Migrations
        if: env.NEXT_PUBLIC_STORAGE_TYPE == 'd1'
        run: wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: pnpm
          wranglerVersion: '4.60.0'
          secrets: ${{ steps.configure.outputs.secret_names }}
          quiet: true
